name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHON_VERSION: '3.11'
      NODE_VERSION: '18.x'
      WORKING_DIR: 'a1 a1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            ${{ env.WORKING_DIR }}/package-lock.json

      - name: Use Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
            python-version: ${{ env.PYTHON_VERSION }}
            cache: 'pip'
            cache-dependency-path: |
              ${{ env.WORKING_DIR }}/requirements.txt
              ${{ env.WORKING_DIR }}/requirements-dev.txt

      - name: Install Node dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ${{ env.WORKING_DIR }}
        run: npx playwright install --with-deps

      - name: Install Python dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint & Type Check (Python)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          ruff check .
          black --check .
          mypy . || true

      - name: Run Playwright tests
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          npx playwright test --reporter=list

      - name: Upload Playwright test results (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ env.WORKING_DIR }}/playwright-report/
          if-no-files-found: ignore

      - name: Upload test-results folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.WORKING_DIR }}/test-results/
          if-no-files-found: ignore

      - name: Cache generated flipbooks (optional)
        if: false
        uses: actions/cache@v4
        with:
          path: ${{ env.WORKING_DIR }}/assets/flipbooks
          key: flipbooks-${{ hashFiles(format('{0}/tools/generate_flipbooks.py', env.WORKING_DIR)) }}

  lint-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    env:
      PYTHON_VERSION: '3.11'
      NODE_VERSION: '18.x'
      WORKING_DIR: 'a1 a1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.WORKING_DIR }}/requirements-dev.txt
      - name: Install minimal deps
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          npm ci --omit=optional
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Python lint + type check
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          ruff check .
          black --check .
          mypy . || true
      - name: JS syntax check (optional)
        if: false
        run: echo "Add ESLint here if needed"
